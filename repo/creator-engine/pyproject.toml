[tool.uv]
package = false
# One OpenCV build for the whole workspace: mediapipe asks for opencv-contrib-python, rapidocr
# for opencv-python; both ship the same `cv2` module and would overwrite each other. Services
# are headless, so every OpenCV request resolves to opencv-python-headless (ADR 0042).
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
    "opencv-contrib-python; sys_platform == 'never'",
]

