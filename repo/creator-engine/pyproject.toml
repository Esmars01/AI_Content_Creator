[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["infra", "apps/web", "packages/ts", "*.md"]  # markdown (incl. the spec) is never reformatted by ruff

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# S101: assert is the pytest idiom. RUF001-003: multilingual text (tr, az, ru, ar) is intrinsic here.
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"**/tests/**" = ["S"]
"scripts/**" = ["S603", "S607"]
"scripts/fixtures/author_llm_fixtures.py" = ["E501", "S105"]  # authored scripts: long natural-language strings
"packages/py/ce_db/src/ce_db/migrations/versions/*" = ["E501"]  # autogenerated DDL
"packages/py/ce_db/src/ce_db/rules.py" = ["S608"]  # SQL built from fixed table-name constants
"packages/py/ce_testing/src/ce_testing/database.py" = ["S603"]  # runs alembic with a fixed argv

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["packages/py", "apps", "plugins", "scripts", "tests"]
exclude = ["apps/web/", "scripts/(smoke|bench|calibrate)/run\\.py"]  # 6-line shims over ce_worker.validation_cli

# Strict on the packages the spec names (section 7).
[[tool.mypy.overrides]]
module = ["ce_core.*", "ce_contracts.*", "ce_behavior.*"]  # "pkg.*" also matches "pkg" itself
# The per-module equivalent of --strict. `strict = true` is not used here because mypy applies it globally
# when set in an override (verified in Phase 0 with a probe module in ce_db).
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/py", "apps", "plugins"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "infra: needs the Compose core infrastructure (skipped with a reason when it is not running)",
    "invariant: architecture invariant tests (section 4)",
    "behavior: behavior/world/memory suites (section 37)",
    "acceptance: Director acceptance fixtures in fixture mode (section 37)",
    "slow: runs the real CPU engines (Kokoro, faster-whisper, MediaPipe); skipped without their assets",
    "golden: render golden tests (section 37)",
]
addopts = "-ra --import-mode=importlib"
# Package-qualified test helpers (`tests.phase0…`) import from the repository root.
pythonpath = ["."]
