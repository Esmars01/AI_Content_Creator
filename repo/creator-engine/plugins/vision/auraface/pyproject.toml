[project]
name = "ce-plugin-vision-auraface"
version = "0.1.0"
description = "face.embed on CPU with AuraFace glintr100 (Apache-2.0), aligned by MediaPipe landmarks."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "numpy>=2.0", "pillow>=11.0", "onnxruntime>=1.20", "mediapipe>=1.0.1", "opencv-python-headless>=4.10"]

[project.entry-points."creator_engine.plugins"]
auraface = "ce_plugin_auraface"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_auraface"]
