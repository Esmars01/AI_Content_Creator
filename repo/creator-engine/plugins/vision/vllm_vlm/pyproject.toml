[project]
name = "ce-plugin-vision-vllm"
version = "0.1.0"
description = "vision.image and vision.video (structured answers) with Qwen3.6-35B-A3B (FP8) or Qwen3.8-27B served in-process by vLLM on the vllm GPU family."
requires-python = ">=3.10"
# Light dependencies only; vllm and torch come from the vllm family image.
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
vlm_qwen36_35b_a3b = "ce_plugin_vision_vllm.qwen36"
vlm_qwen38_27b = "ce_plugin_vision_vllm.qwen38"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_vision_vllm"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
