[project]
name = "ce-plugin-embed-text"
version = "0.1.0"
description = "embed.text on CPU with an ONNX multilingual text encoder (Phase 12; model pin and license pending, see README)."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "numpy>=2.0", "onnxruntime>=1.20", "tokenizers>=0.20"]

# No entry point yet: the plugin is not discovered (never routed) until its model is pinned at a
# revision whose license is verified and its plugin.yaml exists (README, ADR 0057).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_text_embed"]
