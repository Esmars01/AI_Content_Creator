[project]
name = "ce-plugin-embed-speaker"
version = "0.1.0"
description = "voice.embed (speaker identity embedding) with SpeechBrain ECAPA-TDNN (VoxCeleb) for voice-drift checks."
requires-python = ">=3.10"
# Light dependencies only; speechbrain and torch come from the asr family image.
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
speaker_ecapa = "ce_plugin_embed_speaker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_embed_speaker"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
