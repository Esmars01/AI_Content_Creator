defaults:
  size_buckets: { "480": infinitetalk-480, "720": infinitetalk-720 }
  clip_frames: 81 # one clip; streaming beyond it (frames are 4n+1)
  motion_frame: 9 # frames carried between streaming windows (README default)
  fps: 25
  steps: 4 # with the LightX2V distillation LoRA
  shift: 2.0
  text_guide_scale: 1.0 # README: 1 with a LoRA (5 without)
  audio_guide_scale: 2.0 # README: 2 with a LoRA (4 without)
  lora_scale: 1.0
  quant: null # "fp8" selects quant_models/infinitetalk_single_fp8 (40 steps; the LoRA is then ignored upstream)
  num_persistent_param_in_dit: 0 # weight offloading (fits the 24–48 GB classes); raise on 96 GB GPUs
  color_correction_strength: 1.0
  low_memory: { num_persistent_param_in_dit: 0, t5_cpu: true } # OOM retry settings (§25)
  reference_gpu: rtx_pro_6000_96gb
  verbal_cue: "A person is talking."
  negative: ""
pricing: { seconds_per_unit: 30.0, load_seconds: 180.0 } # on the reference GPU class (defaults.reference_gpu); placeholders until smoke runs measure them [RV]
allowed_envs: [dev, test, prod]
status: sandbox
validation: untested_on_gpu
maturity_notes: "Not yet run on a GPU here. Model-card claims: color drift beyond ~60 s (chunk to ≤ 25 s); LoRA lowers ID preservation slightly; lip sync validated by the authors for en/zh only."
