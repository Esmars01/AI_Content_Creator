        files: [config.json, preprocessor_config.json, pytorch_model.bin]
        license:
          {
            name: MIT,
            url: "https://huggingface.co/TencentGameMate/chinese-wav2vec2-base/blob/3991242c806928916fff4a8c0e4f76acf661b743/README.md",
            commercial_use: true,
            conditions: [],
            verified_at: 2026-10-04,
            verified_by: claude-code,
