[project]
name = "ce-plugin-avatar-infinitetalk"
version = "0.1.0"
description = "avatar.a2v with InfiniteTalk (Wan2.1-I2V-14B + audio adapter, LightX2V 4-step LoRA, fp8) on the wan GPU family."
# Imported by the wan worker image next to the upstream InfiniteTalk code (Python 3.10, §7).
requires-python = ">=3.10"
# Light dependencies only: the heavy stack (torch, the InfiniteTalk repository, xformers, …) is
# installed by infra/docker/worker-wan.Dockerfile and imported by backend.py at load time.
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
infinitetalk = "ce_plugin_avatar_infinitetalk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_avatar_infinitetalk"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
