[project]
name = "ce-plugin-avatar-longcat"
version = "0.1.0"
description = "avatar.a2v with LongCat-Video-Avatar 1.5 (Whisper-large-v3 audio encoder, 8-step distillation, INT8 DiT) on the wan GPU family."
requires-python = ">=3.10"
# Light dependencies only; the LongCat-Video repository and its pinned torch stack are installed by
# infra/docker/worker-wan.Dockerfile (variant `longcat_avatar`) and imported by backend.py at load time.
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
longcat_avatar = "ce_plugin_avatar_longcat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_avatar_longcat"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
