[project]
name = "ce-plugins-mock"
version = "0.1.0"
description = "Mock adapters for every capability (§24, §37): real media from FFmpeg, Pillow and numpy; registered only when MOCK_GPU=true."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "numpy>=2.0", "pillow>=11.0"]

# One entry point per plugin; the value is the module that holds its plugin.yaml (§24).
[project.entry-points."creator_engine.plugins"]
mock_image = "ce_plugins_mock.image"
mock_video = "ce_plugins_mock.video"
mock_avatar_global = "ce_plugins_mock.avatar_global"
mock_avatar_segment = "ce_plugins_mock.avatar_segment"
mock_voice = "ce_plugins_mock.voice"
mock_asr = "ce_plugins_mock.asr"
mock_audio = "ce_plugins_mock.audio"
mock_lipsync = "ce_plugins_mock.lipsync"
mock_post = "ce_plugins_mock.post"
mock_expression = "ce_plugins_mock.expression"
mock_identity_trainer = "ce_plugins_mock.identity_trainer"
mock_embed = "ce_plugins_mock.embed"
mock_vision = "ce_plugins_mock.vision"
mock_research = "ce_plugins_mock.research"
mock_observer = "ce_plugins_mock.observer"
mock_qc = "ce_plugins_mock.qc"
mock_effects = "ce_plugins_mock.effects"
mock_provenance = "ce_plugins_mock.provenance"
mock_caption_translate = "ce_plugins_mock.caption_translate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugins_mock"]
