# PROVENANCE_MODE=mock_dev only: pass-through watermark and a labelled JSON manifest; production refuses it (I11).
# Mock: registered only when MOCK_GPU=true; never routed in production (§10.6, §24).
id: mock_provenance
name: Mock provenance (mock_dev)
version: 0.1.0
kind: code
entrypoint: ce_plugins_mock.provenance.adapter:MockProvenance
mock: true
capabilities:
  - id: provenance.watermark_video
    features: [invisible]
  - id: provenance.watermark_audio
    features: [invisible]
  - id: provenance.sign
    features: [c2pa]
  - id: provenance.verify
    features: [c2pa, watermark]
runtime:
  {
    family: cpu_inproc,
    python: "3.12",
    requires_gpu: false,
    min_vram_gb: 0,
    recommended_vram_gb: 0,
    supports_cpu: true,
  }
models:
  - key: mock-provenance
    display_name: mock-provenance (procedural mock, no weights)
    source: { type: builtin, revision: "1" }
    license:
      {
        name: LicenseRef-CreatorEngine-FirstParty,
        url: "plugins/mock/README.md",
        commercial_use: true,
        conditions: [],
        verified_at: 2026-10-03,
        verified_by: claude-code,
      }
pricing: { seconds_per_unit: 0.01 }
allowed_envs: [dev, test]
status: production
validation: untested_on_gpu
maturity_notes: "Mock engine; outputs are labelled and not model output."
