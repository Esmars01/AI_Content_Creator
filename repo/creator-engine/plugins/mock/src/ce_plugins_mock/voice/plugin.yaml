# Tone bursts per word at the estimated duration, honoring pauses, with synthetic word timings (§37).
# Mock: registered only when MOCK_GPU=true; never routed in production (§10.6, §24).
id: mock_voice
name: Mock voice engine
version: 0.1.0
kind: model_adapter
entrypoint: ce_plugins_mock.voice.adapter:MockVoice
behavior_translator: ce_plugins_mock.voice.translator:MockVoiceTranslator
mock: true
capabilities:
  - id: voice.tts
    features: [word_timestamps]
    languages: { mode: any, validated: [en], unvalidated: [de, es, fr, it, ru, tr, ar] }
  - id: voice.design
    features: [description]
    languages: { mode: any, validated: [en], unvalidated: [de, es, fr, it, ru, tr, ar] }
  - id: voice.clone_prepare
    features: [zero_shot]
    languages: { mode: any, validated: [en], unvalidated: [de, es, fr, it, ru, tr, ar] }
  - id: voice.convert
    features: [any_to_any]
behavior_matrix:
  emotion_vocal: { control: text_segment, temporal_precision: segment, vocabulary: any_text }
  prosody_rate: { control: parametric, temporal_precision: segment }
  prosody_pitch: { control: parametric, temporal_precision: segment }
  prosody_energy: { control: parametric, temporal_precision: segment }
  prosody_emphasis: { control: parametric, temporal_precision: word }
  prosody_pause: { control: parametric, temporal_precision: word }
  nonverbal_audio: { control: none }
  delivery: { control: none }
  accent: { control: none }
runtime:
  { family: cpu_model, python: "3.12", requires_gpu: false, min_vram_gb: 0, recommended_vram_gb: 0, supports_cpu: true }
models:
  - key: mock-voice
    display_name: mock-voice (procedural mock, no weights)
    source: { type: builtin, revision: "1" }
    license:
      {
        name: LicenseRef-CreatorEngine-FirstParty,
        url: "plugins/mock/README.md",
        commercial_use: true,
        conditions: [],
        verified_at: 2026-10-03,
        verified_by: claude-code,
      }
pricing: { seconds_per_unit: 0.05 }
allowed_envs: [dev, test]
status: production
validation: untested_on_gpu
maturity_notes: "Mock engine; outputs are labelled and not model output."
