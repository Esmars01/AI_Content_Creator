[project]
name = "ce-plugin-voice-kokoro"
version = "0.1.0"
description = "voice.tts on CPU with Kokoro-82M (ONNX int8, dev only: GPL phonemizer stack, ADR 0043)."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "numpy>=2.0", "kokoro-onnx>=0.6.1", "onnxruntime>=1.20"]

[project.entry-points."creator_engine.plugins"]
kokoro_cpu = "ce_plugin_voice_kokoro"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_voice_kokoro"]
