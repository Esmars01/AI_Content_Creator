[project]
name = "ce-plugin-voice-voxcpm2"
version = "0.1.0"
description = "voice.tts, voice.clone_prepare and voice.design with VoxCPM2 (30 languages, instruction-controlled cloning, 48 kHz) on the tts GPU family."
requires-python = ">=3.10"
# Light dependencies only; the engine package and torch come from the tts family image.
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
voxcpm2 = "ce_plugin_voice_voxcpm2"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_voice_voxcpm2"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
