[project]
name = "ce-plugin-voice-qwen3-tts"
version = "0.1.0"
description = "voice.tts, voice.clone_prepare and voice.design with Qwen3-TTS 1.7B (Base for cloning, VoiceDesign for designed voices) on the tts GPU family."
requires-python = ">=3.10"
# Light dependencies only; the engine package and torch come from the tts family image.
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
qwen3_tts = "ce_plugin_voice_qwen3_tts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_voice_qwen3_tts"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
