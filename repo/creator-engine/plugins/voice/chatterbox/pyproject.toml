[project]
name = "ce-plugin-voice-chatterbox"
version = "0.1.0"
description = "voice.tts and voice.clone_prepare with Chatterbox (English), Chatterbox-Turbo (English, paralinguistic tags) and Chatterbox Multilingual V3 (23 languages incl. tr/ar), on the tts GPU family."
requires-python = ">=3.10"
# Light dependencies only; the chatterbox repository (pinned commit) and torch come from the tts family image.
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
chatterbox = "ce_plugin_voice_chatterbox.base"
chatterbox_turbo = "ce_plugin_voice_chatterbox.turbo"
chatterbox_multilingual = "ce_plugin_voice_chatterbox.multilingual"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_voice_chatterbox"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
