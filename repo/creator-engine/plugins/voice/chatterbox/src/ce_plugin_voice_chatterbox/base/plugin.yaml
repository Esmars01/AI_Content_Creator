# Chatterbox (§39.7: the English TTS default). Zero-shot voice cloning from a ~10 s reference;
# expressiveness through exaggeration/CFG; pauses as inserted silence. Values describing behavior are
# model-card claims [RV] until smoke runs and benchmarks measure them.
id: chatterbox
name: Chatterbox (English)
version: 0.1.0
kind: model_adapter
entrypoint: ce_plugin_voice_chatterbox.adapter:ChatterboxAdapter
behavior_translator: ce_plugin_voice_chatterbox.translator:ChatterboxTranslator
test_backend: ce_plugin_voice_chatterbox.testing:fake_backend
capabilities:
  - id: voice.tts
    features: []
    languages: { mode: text, validated: [en], unvalidated: [] }
  - id: voice.clone_prepare
    features: [zero_shot]
    languages: { mode: text, validated: [en], unvalidated: [] }
behavior_matrix:
  emotion_vocal: { control: emergent } # no emotion-label control: read from the text and the voice
  prosody_rate: { control: parametric, temporal_precision: segment } # ±10% time-stretch (§21)
  prosody_pitch: { control: none }
  prosody_energy: { control: parametric, temporal_precision: segment } # exaggeration / cfg_weight [RV]
  prosody_emphasis: { control: none }
  prosody_pause: { control: parametric, temporal_precision: word } # inserted silence
  nonverbal_audio: { control: none }
  delivery: { control: none }
  accent: { control: none } # a property of the reference voice (§21)
runtime:
  {
    family: tts,
    python: "3.10",
    cuda: "12.8",
    requires_gpu: true,
    min_vram_gb: 8,
    recommended_vram_gb: 16,
    supports_cpu: false,
  }
models:
  - key: chatterbox-en
    size_gb: 2.97 # weights at the pin + fetched dependencies (HF API, 2026-10-04)
    display_name: ResembleAI/chatterbox (pinned revision)
    source: { type: huggingface, repo: ResembleAI/chatterbox, revision: 5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18 }
    files: [ve.safetensors, t3_cfg.safetensors, s3gen.safetensors, tokenizer.json, conds.pt]
    license:
      {
        name: MIT,
        url: "https://huggingface.co/ResembleAI/chatterbox/blob/5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18/README.md",
        commercial_use: true,
        conditions: [],
        verified_at: 2026-10-04,
        verified_by: claude-code,
        evidence: "model_card: license mit at the pinned revision",
      }
    dependencies:
      - ref: "github:resemble-ai/chatterbox@5de7a54aa4e5e2baadb0182dde554908b48b85c2"
        role: code
        source:
          {
            type: git,
            repo: "https://github.com/resemble-ai/chatterbox",
            revision: 5de7a54aa4e5e2baadb0182dde554908b48b85c2,
          }
        license:
          {
            name: MIT,
            url: "https://github.com/resemble-ai/chatterbox/blob/5de7a54aa4e5e2baadb0182dde554908b48b85c2/LICENSE",
            commercial_use: true,
            conditions: [],
            verified_at: 2026-10-04,
            verified_by: claude-code,
            text_sha256: 4248e910a928849fe5815a0f9236e17fa07768d95b9193212752c464b93d6caa,
            evidence: license_file,
          }
      - ref: "github:resemble-ai/Perth@ff1c8ac55a976971245cdd53c18d6131ca00d993"
        role: watermark_code # Chatterbox watermarks every output with Perth
        source:
          {
            type: git,
            repo: "https://github.com/resemble-ai/Perth",
            revision: ff1c8ac55a976971245cdd53c18d6131ca00d993,
          }
        license:
          {
            name: MIT,
            url: "https://github.com/resemble-ai/Perth/blob/ff1c8ac55a976971245cdd53c18d6131ca00d993/LICENSE",
            commercial_use: true,
            conditions: [],
            verified_at: 2026-10-04,
            verified_by: claude-code,
            text_sha256: 4543f6777abede354f09bc2ba6580bd475c364e7d6f39315bf9d315d033b48f4,
            evidence: license_file,
          }
defaults:
  temperature: 0.8
  reference_gpu: rtx_4090_24gb
pricing: { seconds_per_unit: 0.5, load_seconds: 30.0 } # placeholders until smoke runs measure them [RV]
allowed_envs: [dev, test, prod]
status: sandbox
validation: untested_on_gpu
maturity_notes: "Not yet run on a GPU here. Model card: English, zero-shot cloning, emotion exaggeration control; outputs carry the Perth watermark."
