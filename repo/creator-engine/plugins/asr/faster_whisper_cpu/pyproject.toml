[project]
name = "ce-plugin-asr-faster-whisper"
version = "0.1.0"
description = "asr.transcribe, asr.align (coarse word timestamps) and asr.lid on CPU with faster-whisper."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "ce-plugin-kit", "numpy>=2.0", "faster-whisper>=1.2.1"]

[project.entry-points."creator_engine.plugins"]
faster_whisper_cpu = "ce_plugin_asr_faster_whisper"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_asr_faster_whisper"]
