[project]
name = "ce-plugin-asr-ctc-aligner"
version = "0.1.0"
description = "asr.align (tr/ar and other languages without a dedicated aligner) by CTC forced alignment over Omnilingual ASR CTC 1B emissions."
requires-python = ">=3.10"
# Light dependencies only; omnilingual-asr, fairseq2 and torch come from the asr family image.
dependencies = ["ce-contracts", "ce-plugin-kit", "numpy>=1.26"]

[project.entry-points."creator_engine.plugins"]
ctc_aligner = "ce_plugin_asr_ctc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_asr_ctc"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
