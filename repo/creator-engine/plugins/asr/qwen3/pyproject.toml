[project]
name = "ce-plugin-asr-qwen3"
version = "0.1.0"
description = "asr.transcribe and asr.lid with Qwen3-ASR 1.7B, asr.align with Qwen3-ForcedAligner 0.6B, on the asr GPU family."
requires-python = ">=3.10"
# Light dependencies only; qwen-asr and torch come from the asr family image.
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
qwen3_asr = "ce_plugin_asr_qwen3.asr"
qwen3_forced_aligner = "ce_plugin_asr_qwen3.aligner"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_asr_qwen3"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
