[project]
name = "ce-plugin-qc-gpu"
version = "0.1.0"
description = "Model-based QC metrics: qc.lipsync with SyncNet (advisory), qc.vqa with UVQ 1.5, qc.speech_quality with UTMOSv2."
requires-python = ">=3.10"
# Light dependencies only; torch and the upstream code come from the family images.
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
syncnet_v1 = "ce_plugin_qc_gpu.syncnet"
uvq_15 = "ce_plugin_qc_gpu.uvq"
utmos_v2 = "ce_plugin_qc_gpu.utmos"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_qc_gpu"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
