[project]
name = "ce-plugin-qc-dnsmos"
version = "0.1.0"
description = "qc.speech_quality on CPU with DNSMOS P.835 (CC-BY-4.0, attribution)."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "numpy>=2.0", "onnxruntime>=1.20"]

[project.entry-points."creator_engine.plugins"]
dnsmos = "ce_plugin_dnsmos"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_dnsmos"]
