[project]
name = "ce-plugin-captions-ass"
version = "0.1.0"
description = "captions.build: ASS captions with active-word highlight and safe zones, plus SRT and VTT (§27)."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "fonttools>=4.50"]

[project.entry-points."creator_engine.plugins"]
"captions.ass_renderer" = "ce_plugin_captions_ass"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_captions_ass"]
