[project]
name = "ce-plugin-audio-acestep"
version = "0.1.0"
description = "audio.music with ACE-Step 1.5 (turbo DiT, instrumental mode) on the audio GPU family."
requires-python = ">=3.10"
# Light dependencies only; the ACE-Step code (pinned commit) and torch come from the audio family image.
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
acestep_v15 = "ce_plugin_audio_acestep"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_audio_acestep"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
