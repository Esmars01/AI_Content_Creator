[project]
name = "ce-plugin-analysis-prosody"
version = "0.1.0"
description = "audio.prosody: pitch, energy, speech rate and pauses with librosa (ISC)."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "numpy>=2.0", "librosa>=0.11"]

[project.entry-points."creator_engine.plugins"]
prosody_features = "ce_plugin_prosody"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_prosody"]
