[project]
name = "ce-plugin-analysis-mediapipe"
version = "0.1.0"
description = "face.detect, face.landmarks, body.landmarks on CPU with MediaPipe Tasks (Apache-2.0)."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "numpy>=2.0", "mediapipe>=1.0.1", "opencv-python-headless>=4.10"]

[project.entry-points."creator_engine.plugins"]
mediapipe_face = "ce_plugin_mediapipe.face"
mediapipe_body = "ce_plugin_mediapipe.body"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_mediapipe"]
