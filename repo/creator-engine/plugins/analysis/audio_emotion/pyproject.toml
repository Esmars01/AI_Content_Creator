[project]
name = "ce-plugin-audio-emotion"
version = "0.1.0"
description = "audio.emotion with emotion2vec+ base (sandbox: the FunASR model license's commercial terms are not verified)."
requires-python = ">=3.10"
# Light dependencies only; funasr and torch come from the asr family image (variant `funasr`).
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
audio_emotion = "ce_plugin_audio_emotion"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_audio_emotion"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
