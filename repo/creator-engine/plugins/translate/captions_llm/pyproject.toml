[project]
name = "ce-plugin-translate-captions-llm"
version = "0.1.0"
description = "captions.translate: caption translation with the deployment's configured LLM provider (Phase 12)."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "ce-llm"]

[project.entry-points."creator_engine.plugins"]
captions_llm = "ce_plugin_captions_llm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_captions_llm"]
