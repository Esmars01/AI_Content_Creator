[project]
name = "ce-plugin-llm-openai-compatible"
version = "0.1.0"
description = "OpenAI-compatible chat-completions LLM provider (vLLM, LiteLLM, hosted gateways) with JSON-schema output."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "ce-llm", "httpx>=0.27"]

[project.entry-points."creator_engine.plugins"]
"llm.openai_compatible" = "ce_plugin_llm_openai_compatible"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_llm_openai_compatible"]
