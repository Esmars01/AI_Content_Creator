[project]
name = "ce-plugin-llm-fixture"
version = "0.1.0"
description = "Fixture LLM provider: replays recorded or authored responses keyed by scenario and stage."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "ce-llm", "pyyaml>=6"]

[project.entry-points."creator_engine.plugins"]
"llm.fixture" = "ce_plugin_llm_fixture"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_llm_fixture"]
