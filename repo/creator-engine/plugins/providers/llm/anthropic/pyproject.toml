[project]
name = "ce-plugin-llm-anthropic"
version = "0.1.0"
description = "Hosted LLM provider over the Anthropic Messages API, structured output through a forced tool call."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "ce-llm", "httpx>=0.27"]

[project.entry-points."creator_engine.plugins"]
"llm.anthropic" = "ce_plugin_llm_anthropic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_llm_anthropic"]
