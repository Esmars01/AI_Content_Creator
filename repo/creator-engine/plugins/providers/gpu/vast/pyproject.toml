[project]
name = "ce-plugin-gpu-vast"
version = "0.1.0"
description = "Vast.ai GPU provider: on-demand or interruptible marketplace instances (REST API v0)."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "ce-gpu", "httpx>=0.27"]

[project.entry-points."creator_engine.plugins"]
"gpu.vast" = "ce_plugin_gpu_vast"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_gpu_vast"]
