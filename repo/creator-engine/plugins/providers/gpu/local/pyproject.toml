[project]
name = "ce-plugin-gpu-local"
version = "0.1.0"
description = "Local provider: workers started outside the fleet manager (compose worker-cpu, a self-managed host)."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "ce-gpu"]

[project.entry-points."creator_engine.plugins"]
"gpu.local" = "ce_plugin_gpu_local"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_gpu_local"]
