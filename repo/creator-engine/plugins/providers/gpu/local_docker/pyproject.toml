[project]
name = "ce-plugin-gpu-local-docker"
version = "0.1.0"
description = "local_docker GPU provider: starts family worker containers on a local GPU host through the Docker Engine API."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "ce-gpu", "httpx>=0.27"]

[project.entry-points."creator_engine.plugins"]
"gpu.local_docker" = "ce_plugin_gpu_local_docker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_gpu_local_docker"]
