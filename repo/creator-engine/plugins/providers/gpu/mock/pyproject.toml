[project]
name = "ce-plugin-gpu-mock"
version = "0.1.0"
description = "Mock GPU provider: simulated workers with configurable prices, start latency and failure injection."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "ce-gpu"]

[project.entry-points."creator_engine.plugins"]
"gpu.mock" = "ce_plugin_gpu_mock"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_gpu_mock"]
