[project]
name = "ce-plugin-storage-s3"
version = "0.1.0"
description = "S3-API object storage provider (SeaweedFS, Cloudflare R2)."
requires-python = ">=3.12"
dependencies = ["ce-core", "ce-storage", "boto3>=1.40"]

[project.entry-points."creator_engine.plugins"]
"storage.s3" = "ce_plugin_storage_s3"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_storage_s3"]
