[project]
name = "ce-plugin-image-z-image"
version = "0.1.0"
description = "image.generate with Z-Image-Turbo (diffusers ZImagePipeline, 8 NFEs) on the image GPU family."
requires-python = ">=3.10"
# Light dependencies only; torch/diffusers are installed by the GPU family image and imported by backend.py at load time.
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
z_image_turbo = "ce_plugin_image_z_image"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_image_z_image"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
