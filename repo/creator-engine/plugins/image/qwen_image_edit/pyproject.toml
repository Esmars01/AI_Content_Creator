[project]
name = "ce-plugin-image-qwen-edit"
version = "0.1.0"
description = "image.edit with Qwen-Image-Edit-2511 (diffusers QwenImageEditPlusPipeline, multi-image references) on the image GPU family."
requires-python = ">=3.10"
# Light dependencies only; torch/diffusers are installed by the GPU family image and imported by backend.py at load time.
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
qwen_image_edit = "ce_plugin_image_qwen_edit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_image_qwen_edit"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
