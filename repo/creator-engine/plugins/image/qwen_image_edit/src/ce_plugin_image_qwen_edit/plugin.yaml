# Qwen-Image-Edit-2511 (§39.7: identity pack, wardrobe and world edits). Instruction editing with
# up to several reference images, always conditioned on the canonical face (§17.2: expansions are
# never chained from previous edits). README settings: 40 steps, true CFG 4, guidance 1.
id: qwen_image_edit
name: Qwen-Image-Edit-2511
version: 0.1.0
kind: model_adapter
entrypoint: ce_plugin_image_qwen_edit.adapter:QwenImageEditAdapter
test_backend: ce_plugin_image_qwen_edit.testing:fake_backend
capabilities:
  - id: image.edit
    features: [instruct, multi_reference]
    languages: { mode: text, validated: [en, zh], unvalidated: [de, es, fr, it, ru, tr, ar] }
    resolutions: [] # any: generated near 1 MP at the requested aspect, then resized
runtime:
  {
    family: image,
    python: "3.10",
    cuda: "12.8",
    requires_gpu: true,
    min_vram_gb: 48,
    recommended_vram_gb: 80,
    supports_cpu: false,
  }
models:
  - key: qwen-image-edit-2511
    size_gb: 53.76 # weights at the pin + fetched dependencies (HF API, 2026-10-04)
    display_name: Qwen/Qwen-Image-Edit-2511 (diffusers)
    source: { type: huggingface, repo: Qwen/Qwen-Image-Edit-2511, revision: 6f3ccc0b56e431dc6a0c2b2039706d7d26f22cb9 }
    files: [model_index.json, "processor/*", "scheduler/*", "text_encoder/*", "tokenizer/*", "transformer/*", "vae/*"]
    license:
      {
        name: Apache-2.0,
        url: "https://huggingface.co/Qwen/Qwen-Image-Edit-2511/blob/6f3ccc0b56e431dc6a0c2b2039706d7d26f22cb9/README.md",
        commercial_use: true,
        conditions: [],
        verified_at: 2026-10-04,
        verified_by: claude-code,
        evidence: "model_card: license apache-2.0 at the pinned revision (Qwen-Image-2.1 is the non-commercial one, §5)",
      }
    dependencies:
      - ref: "github:QwenLM/Qwen-Image@6b5e1f5cec987d404be5ac6657db3b9aacb56a89"
        role: reference_code
        license:
          {
            name: Apache-2.0,
            url: "https://github.com/QwenLM/Qwen-Image/blob/6b5e1f5cec987d404be5ac6657db3b9aacb56a89/LICENSE",
            commercial_use: true,
            conditions: [],
            verified_at: 2026-10-04,
            verified_by: claude-code,
            text_sha256: b907c8234b565e5ecefff8232dbb6f1d603fbf9a47a3176db734dcae27175d08,
            evidence: license_file,
          }
      - ref: "pypi:diffusers==0.40.0"
        role: code
        license:
          {
            name: Apache-2.0,
            url: "https://github.com/huggingface/diffusers/blob/v0.40.0/LICENSE",
            commercial_use: true,
            conditions: [],
            verified_at: 2026-10-04,
            verified_by: claude-code,
            evidence: "PyPI metadata (Apache 2.0 License) of the pinned release",
          }
defaults:
  steps: 40
  true_cfg_scale: 4.0
  guidance_scale: 1.0
  negative: " " # README: an empty-looking negative prompt enables true CFG
  multiple: 16
  max_references: 3
  max_pixels: 1048576 # the pipeline's VAE_IMAGE_SIZE (1024×1024)
  dtype: bf16
  reference_gpu: rtx_pro_6000_96gb
pricing: { seconds_per_unit: 25.0, load_seconds: 120.0 } # placeholders until smoke runs measure them [RV]
allowed_envs: [dev, test, prod]
status: sandbox
validation: untested_on_gpu
maturity_notes: "Not yet run on a GPU here. Model card: improved consistency and multi-image editing over 2509."
