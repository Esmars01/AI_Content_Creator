# MuseTalk 1.5 (§39.7: the lip-sync patch default). Repaints the 256×256 mouth crop of each frame at
# 25 fps from Whisper-tiny features of the new audio and blends it back (see patch.py for the two
# documented differences from upstream, DECISIONS D93).
# License reality [RV]: the code is MIT, but the weights on Hugging Face are CreativeML OpenRAIL-M
# (commercial use allowed, with use-based restrictions that must be passed on); the spec's "MIT"
# covers only the code. Promotion past sandbox needs the owner's review of the OpenRAIL-M terms.
