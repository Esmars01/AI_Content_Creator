[project]
name = "ce-plugin-watermarks"
version = "0.1.0"
description = "Invisible watermarks: provenance.watermark_video with VideoSeal, provenance.watermark_audio with AudioSeal, and their provenance.verify, on the post GPU family."
requires-python = ">=3.10"
# Light dependencies only; videoseal, audioseal and torch come from the post family image.
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
videoseal = "ce_plugin_watermarks.videoseal"
audioseal = "ce_plugin_watermarks.audioseal"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_watermarks"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
