[project]
name = "ce-plugin-video-rife"
version = "0.1.0"
description = "video.interpolate with Practical-RIFE 4.25 (frame-rate conversion) on the post GPU family."
requires-python = ">=3.10"
# Light dependencies only; torch come from the post family image.
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
rife_425 = "ce_plugin_video_rife"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_video_rife"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
