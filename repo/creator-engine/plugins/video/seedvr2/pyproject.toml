[project]
name = "ce-plugin-video-seedvr2"
version = "0.1.0"
description = "video.upscale with SeedVR2-3B (one-step diffusion restoration and upscaling) on the post GPU family."
requires-python = ">=3.10"
# Light dependencies only; the SeedVR code (pinned commit), apex, flash-attn and torch come from the post family image.
dependencies = ["ce-contracts", "ce-plugin-kit"]

[project.entry-points."creator_engine.plugins"]
seedvr2_3b = "ce_plugin_video_seedvr2"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_video_seedvr2"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
