# Wan 2.2 A14B i2v (§39.7: the default B-roll engine) through LightX2V with the 4-step
# distillation LoRAs (high- and low-noise experts), CFG disabled. 16 fps, 4n+1 frames, 480p/720p
# buckets. Clips longer than the 81 frames Wan was trained on are allowed up to 10 s but degrade
# [RV]. Behavior and quality are model-card claims until smoke runs and benchmarks measure them.
id: wan22_a14b_i2v
name: Wan 2.2 A14B i2v (LightX2V 4-step)
version: 0.1.0
kind: model_adapter
entrypoint: ce_plugin_video_wan22.adapters:Wan22A14BI2V
test_backend: ce_plugin_video_wan22.testing:fake_backend
