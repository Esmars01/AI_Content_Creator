[project]
name = "ce-orchestrator"
version = "0.1.0"
description = "Temporal worker: workflows and CPU activities; cpu_inproc plugins."
requires-python = ">=3.12"
dependencies = [
    "ce-config",
    "ce-db",
    "ce-exec",
    "ce-obs",
    "ce-router",
    "temporalio>=1.18",
    "ce-plugins-mock",
    "ce-plugin-captions-ass",
    "ce-plugin-provenance-c2pa",
    "ce-plugin-gpu-local",
    "ce-plugin-voice-kokoro",
    "ce-plugin-asr-faster-whisper",
    "ce-plugin-analysis-mediapipe",
    "ce-plugin-analysis-prosody",
    "ce-plugin-analysis-image-embed",
    "ce-plugin-vision-auraface",
    "ce-plugin-vision-ppocr",
    "ce-plugin-qc-dnsmos",
    "ce-plugin-storage-s3",
    "ce-plugin-storage-local-fs",
    # LLM providers for the Director (`LLM_PROVIDER` picks one; fixture is dev/test only)
    "ce-plugin-llm-fixture",
    "ce-plugin-llm-openai-compatible",
    "ce-plugin-llm-anthropic",
]

[project.scripts]
ce-orchestrator = "ce_orchestrator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_orchestrator"]
