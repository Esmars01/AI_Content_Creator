[project]
name = "ce-scheduler"
version = "0.1.0"
description = "GPU task queue, leases, fleet manager, cost ledger, internal worker API."
requires-python = ">=3.12"
dependencies = [
    "ce-config",
    "ce-contracts",
    "ce-db",
    "ce-gpu",
    "ce-obs",
    "ce-storage",
    "ce-worker",
    "ce-plugins-mock",
    "ce-plugin-gpu-mock",
    "ce-plugin-gpu-local",
    "ce-plugin-gpu-local-docker",
    "ce-plugin-gpu-runpod",
    # a third-party provider stub (dev/test only; registered with MOCK_GPU=true): proves the plugin path
    "ce-plugin-gpu-example-cloud",
    "ce-plugin-voice-kokoro",
    "ce-plugin-asr-faster-whisper",
    "ce-plugin-storage-s3",
    "ce-plugin-storage-local-fs",
    "fastapi>=0.135",
    "uvicorn>=0.32",
    "temporalio>=1.18",
]

[project.scripts]
ce-scheduler = "ce_scheduler.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_scheduler"]
