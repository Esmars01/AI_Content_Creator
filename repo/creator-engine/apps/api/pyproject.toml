[project]
name = "ce-api"
version = "0.2.0"
description = "FastAPI service: public REST + SSE, auth, admin."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1",
    "ce-behavior",
    "ce-build",  # node kinds (QC report and calibration revisions)
    "ce-config",
    "ce-core",
    "ce-db",
    "ce-director",  # the PlanRequest model only: the API never calls an LLM (§9)
    "ce-exec",  # `ce video generate-fixture` only (imported lazily)
    "ce-memory",  # conflict linking shared with MemoryUpdateWorkflow (no model calls)
    "ce-research",  # URL checks and template-free source validation (no fetching in the API)
    "ce-obs",
    "ce-plugin-storage-local-fs",  # installed so entry points register it; never imported (I14)
    "ce-plugin-storage-s3",
    "ce-plugin-provenance-c2pa",  # `GET /v1/renders/{id}/verify` (registry only; never imported, I14)
    "ce-plugins-mock",  # mock provenance layers report themselves in verification (dev/test)
    "ce-policy",
    "ce-qc",
    "ce-storage",
    "ce-testing",  # `ce seed dev` only (imported lazily); fixtures are the seed data
    "fastapi>=0.135",
    "python-multipart>=0.0.20",
    "redis>=6",
    "temporalio>=1.18",  # starting job workflows (§9)
    "typer>=0.12",
    "uvicorn[standard]>=0.37",
]

[project.scripts]
ce = "ce_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_api"]
