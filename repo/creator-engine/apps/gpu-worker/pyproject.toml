[project]
name = "ce-gpu-worker"
version = "0.1.0"
description = "Generic worker runtime entrypoint (loads plugins by family; also built as worker-cpu)."
requires-python = ">=3.12"
dependencies = [
    "ce-config",
    "ce-contracts",
    "ce-obs",
    "ce-worker",
    "ce-plugins-mock",
    # real CPU engines of the cpu_model family (used when their assets are present, §35)
    "ce-plugin-voice-kokoro",
    "ce-plugin-asr-faster-whisper",
]

[project.scripts]
ce-gpu-worker = "ce_gpu_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_gpu_worker"]
