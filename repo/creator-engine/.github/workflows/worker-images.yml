# Worker images (production cutover §15): reproducible, prebuilt GPU worker images, so a rented
# instance boots the image itself (Vast `runtype: args`, no SSH, nothing installed at boot) and only
# downloads weights into its model cache.
#
# Manual: an operator builds and pushes the images a deployment uses, then points the provider's
# `image_template` (or `images`) at them. Tags are immutable per commit (`<variant>-<sha>`) plus a moving
# `<variant>` tag; the provider configuration should reference the immutable one.
#
# Status: never run here (no GPU, no registry credentials in this environment). The Dockerfiles are
# generated by scripts/gen_worker_dockerfiles.py and checked for freshness in CI (tests/phase8).
name: worker-images

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "family:variant or profile:<name>, comma-separated (e.g. profile:talking_head,wan:infinitetalk,tts:chatterbox)"
        required: true
        default: "profile:talking_head"
      registry:
        description: "image prefix (the provider's image_template without the {family}:{variant} part)"
        required: true
        default: "ghcr.io/${{ github.repository_owner }}/creator-engine-worker"
      push:
        description: "push the images (false: build only)"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          out = []
          for item in os.environ["TARGETS"].split(","):
              kind, _, name = item.strip().partition(":")
              if not name:
                  raise SystemExit(f"bad target {item!r}: use family:variant or profile:<name>")
              if kind == "profile":
                  out.append({"file": f"infra/docker/worker-profile-{name}.Dockerfile", "target": name, "tag": f"profile:{name}"})
              else:
                  out.append({"file": f"infra/docker/worker-{kind}.Dockerfile", "target": name, "tag": f"{kind}:{name}"})
          print("matrix=" + json.dumps({"include": out}))
          PY
        env:
          TARGETS: ${{ inputs.targets }}

  build:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: the Dockerfiles are what the generator renders
        run: uv run --with pyyaml python scripts/gen_worker_dockerfiles.py --check
      - name: free disk (CUDA and torch layers are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ inputs.push }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tags
        id: tags
        run: |
          family="${TAG%%:*}"; variant="${TAG#*:}"
          echo "tags=${REGISTRY}-${family}:${variant}-${GITHUB_SHA::12},${REGISTRY}-${family}:${variant}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ matrix.tag }}
          REGISTRY: ${{ inputs.registry }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
      - name: image size (record it in docs/PRODUCTION_MODEL_AND_GPU_OPERATIONS.md, profile image_gb)
        if: ${{ inputs.push }}
        run: docker buildx imagetools inspect "${REGISTRY}-${TAG%%:*}:${TAG#*:}-${GITHUB_SHA::12}" | head -20
        env:
          TAG: ${{ matrix.tag }}
          REGISTRY: ${{ inputs.registry }}
