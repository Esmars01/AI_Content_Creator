# Model-agnostic natural-language descriptions of every vocabulary token (§15.2), with aliases
# (used to map unknown LLM labels to the nearest token, §13) and descriptor variants (used for
# anti-repetition between consecutive shots, §15.8). Text-prompted translators and the
# Director LLM read these; they never contain engine syntax (I1).
# A plain string is shorthand for {text: ...}. Emotions also carry `vocal`: the same emotion
# phrased for the voice channel (instruction-following TTS), since `text` describes the face.
vocab_version: "2026.10.1"
descriptions:
  emotion:
    neutral: {text: "a neutral, relaxed face with no particular emotion", vocal: "an even, neutral tone with no particular emotion", aliases: [plain, flat, expressionless], variants: ["a composed, even expression", "a relaxed resting face"]}
    confident: {text: "self-assured and at ease, steady eye contact, relaxed authority", vocal: "a self-assured, steady voice with relaxed authority", aliases: [assured, self_assured, sure], variants: ["calm self-assurance", "quiet, steady confidence"]}
    amused: {text: "lightly entertained, a hint of a smile in the eyes and mouth", vocal: "a lightly amused tone, a smile audible in the voice", aliases: [entertained, tickled], variants: ["quietly entertained", "a playful glint of amusement"]}
    curious: {text: "interested and inquisitive, attentive and slightly leaning toward the idea", vocal: "an interested, inquisitive tone", aliases: [inquisitive, intrigued, interested], variants: ["open, interested attention", "an inquisitive spark"]}
    excited: {text: "energized and enthusiastic, animated face and lively delivery", vocal: "an energized, enthusiastic voice with lively intonation", aliases: [enthusiastic, thrilled, energetic, hyped], variants: ["bright, animated enthusiasm", "eager, lively energy"]}
    serious: {text: "earnest and focused, steady gaze, no smile", vocal: "an earnest, focused tone", aliases: [earnest, grave, solemn], variants: ["focused earnestness", "a sober, steady expression"]}
    skeptical: {text: "doubtful and unconvinced, a slight squint or raised brow", vocal: "a doubtful, unconvinced tone", aliases: [doubtful, unconvinced, suspicious], variants: ["a measured, doubtful look", "quiet disbelief"]}
    uncertain: {text: "unsure of the answer, searching, slightly hesitant", vocal: "an unsure, tentative tone", aliases: [unsure, doubting_self], variants: ["searching uncertainty", "a tentative, unsure look"]}
    hesitant: {text: "reluctant to commit, holding back, pauses before speaking", vocal: "a reluctant, holding-back voice", aliases: [reluctant, tentative], variants: ["guarded reluctance", "a careful, holding-back manner"]}
    confused: {text: "puzzled, trying to make sense of something", vocal: "a puzzled tone, as if working something out", aliases: [puzzled, perplexed, baffled], variants: ["a puzzled frown", "visible bewilderment"]}
    surprised: {text: "taken aback by something unexpected, eyes widening", vocal: "a taken-aback tone, as if hearing something unexpected", aliases: [astonished, startled, shocked], variants: ["sudden astonishment", "a startled reaction"]}
    embarrassed: {text: "self-conscious and a little awkward, glancing away", vocal: "a self-conscious, slightly awkward voice", aliases: [sheepish, awkward, abashed], variants: ["sheepish self-consciousness", "a flustered, awkward look"]}
    frustrated: {text: "annoyed at an obstacle, tense jaw, clipped delivery", vocal: "an annoyed, clipped tone", aliases: [annoyed, exasperated, irritated], variants: ["exasperated tension", "contained annoyance"]}
    angry: {text: "openly angry, tense face, forceful delivery", vocal: "an openly angry, forceful voice", aliases: [furious, mad, outraged], variants: ["hot, forceful anger", "barely held fury"]}
    sad: {text: "downcast and low in energy, softened face", vocal: "a low, downcast voice", aliases: [unhappy, sorrowful, down], variants: ["quiet sadness", "a heavy, downcast look"]}
    calm: {text: "peaceful and unhurried, relaxed face and body", vocal: "a peaceful, unhurried voice", aliases: [serene, relaxed, tranquil], variants: ["unhurried calm", "a settled, peaceful presence"]}
    warm: {text: "friendly and caring, soft eyes and a gentle smile", vocal: "a friendly, caring voice", aliases: [friendly, kind, caring, affectionate], variants: ["gentle friendliness", "open, caring warmth"]}
    sarcastic: {text: "mockingly ironic, saying one thing and meaning another", vocal: "a mockingly ironic tone", aliases: [ironic, mocking, wry], variants: ["dry irony", "a knowing, mocking tone"]}
    determined: {text: "resolved and committed, firm jaw and direct gaze", vocal: "a firm, resolved voice", aliases: [resolute, resolved, firm], variants: ["firm resolve", "steely determination"]}
    relieved: {text: "tension released after a worry passes", vocal: "a relieved, released tone", aliases: [unburdened, eased], variants: ["a released breath of relief", "visible relief"]}
    concerned: {text: "worried about something, attentive and slightly tense", vocal: "a worried, slightly tense tone", aliases: [worried, anxious, troubled], variants: ["careful concern", "a worried attentiveness"]}
    playful: {text: "light-hearted and teasing, mischievous energy", vocal: "a light-hearted, teasing tone", aliases: [teasing, mischievous, cheeky], variants: ["light, teasing mischief", "a cheeky playfulness"]}
