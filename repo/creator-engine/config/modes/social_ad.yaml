# Video mode template (§13). Effective maturity in the UI is capped by route validation (§10.4).
id: social_ad
label: Social ad
maturity: production
roadmap: MVP
description: "A short persuasive ad with a clear call to action."
allowed_shot_types: [talking_head, product, broll, insert, title_card]
default_camera_profiles: [phone_front_selfie, desk_mirrorless]
default_world_kinds: [home_office, kitchen, living_room, studio]
duration_s: {min: 10, max: 60, default: 20}
aspects: ["9:16", "16:9", "1:1", "4:5"]
edit_grammar: {max_shot_s: 4, cutaway_every_s: 5, punch_in_on_emphasis: true, beat_snap: true}
acting_density: high
editorial_methods: [editorial_cutaway, editorial_punch, caption_emphasis, music_cue, sfx_cue]
strategy_packs: [hook_problem_payoff_cta]
requires: []
prompt_fragment: null
