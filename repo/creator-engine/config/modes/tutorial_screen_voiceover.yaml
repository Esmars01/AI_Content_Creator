# Video mode template (§13). Effective maturity in the UI is capped by route validation (§10.4).
id: tutorial_screen_voiceover
label: Screen tutorial, voice-over
maturity: production
roadmap: MVP
description: "A screen recording narrated by the creator, with zooms and speed segments."
allowed_shot_types: [screen, title_card]
default_camera_profiles: [screen_only]
default_world_kinds: []
duration_s: {min: 30, max: 600, default: 90}
aspects: ["9:16", "16:9", "1:1", "4:5"]
edit_grammar: {max_shot_s: 20, cutaway_every_s: 0, punch_in_on_emphasis: false, beat_snap: false}
acting_density: low
editorial_methods: [caption_emphasis, music_cue]
strategy_packs: [tutorial_steps]
requires: [screen_asset]
prompt_fragment: null
