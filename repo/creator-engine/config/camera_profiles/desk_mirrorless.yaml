# Camera profile (§22). Deterministic camera and realism post use these values (ADR 0009).
id: desk_mirrorless
label: Mirrorless camera on a desk tripod
maturity: production
prompt_hints: ["mirrorless camera on a tripod, clean image", "soft background blur"]
subject_distance_m: 1.0
sensor: { fps: 30, noise_luma: 0.004, noise_chroma: 0.002, rolling_shutter: 0.0 }
lens: { focal_equiv_mm: 35, distortion_k1: 0.01, vignette: 0.08, dof: medium }
framing: { default: medium_close_up, headroom: 0.1, eye_line: 0.38, overscan: 0.1 }
motion: { type: tripod, amplitude_px: 1, freq_hz: [0.1, 0.4], rotation_deg: 0.05, breathing_sway: false, stabilization: 1.0 }
focus: { autofocus_hunts_per_min: 0.0 }
exposure: { auto_exposure_drift: 0.01 }
color: { lut: luts/mirrorless_neutral.cube, saturation: 1.0 }
compression: { codec: h264, bitrate_kbps: 16000 }
audio: { mic_profile: usb_condenser, distance_m: 0.5 }
