# Camera profile (§22). Deterministic camera and realism post use these values (ADR 0009).
id: laptop_camera
label: Laptop built-in camera
maturity: production
prompt_hints: ["laptop camera, looking slightly up at the person"]
subject_distance_m: 0.6
sensor: { fps: 30, noise_luma: 0.025, noise_chroma: 0.012, rolling_shutter: 0.0 }
lens: { focal_equiv_mm: 28, distortion_k1: 0.03, vignette: 0.25, dof: deep }
framing: { default: medium_close_up, headroom: 0.06, eye_line: 0.42, overscan: 0.1 }
motion: { type: static, amplitude_px: 0, freq_hz: [0.0, 0.0], rotation_deg: 0.0, breathing_sway: false, stabilization: 1.0 }
focus: { autofocus_hunts_per_min: 0.3 }
exposure: { auto_exposure_drift: 0.05 }
color: { lut: luts/webcam_flat.cube, saturation: 0.95 }
compression: { codec: h264, bitrate_kbps: 3500 }
audio: { mic_profile: laptop_mic, distance_m: 0.6 }
