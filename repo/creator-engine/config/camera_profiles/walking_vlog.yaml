# Camera profile (§22). Deterministic camera and realism post use these values (ADR 0009).
id: walking_vlog
label: Walking vlog
maturity: experimental
prompt_hints: ["walking vlog, selfie stick"]
subject_distance_m: 0.7
sensor: { fps: 30, noise_luma: 0.008, noise_chroma: 0.004, rolling_shutter: 0.003 }
lens: { focal_equiv_mm: 18, distortion_k1: 0.05, vignette: 0.15, dof: deep }
framing: { default: medium_close_up, headroom: 0.08, eye_line: 0.38, overscan: 0.15 }
motion: { type: walking, amplitude_px: 10, freq_hz: [1.5, 2.5], rotation_deg: 0.8, breathing_sway: true, stabilization: 0.6 }
focus: { autofocus_hunts_per_min: 0.6 }
exposure: { auto_exposure_drift: 0.05 }
color: { lut: luts/phone_natural.cube, saturation: 1.03 }
compression: { codec: h264, bitrate_kbps: 12000 }
audio: { mic_profile: phone_front_mic, distance_m: 0.6 }
