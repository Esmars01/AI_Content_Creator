# Camera profile (§22). Deterministic camera and realism post use these values (ADR 0009).
id: webcam
label: Desktop webcam
maturity: production
prompt_hints: ["webcam video call framing", "slightly soft image"]
subject_distance_m: 0.7
sensor: { fps: 30, noise_luma: 0.02, noise_chroma: 0.01, rolling_shutter: 0.0 }
lens: { focal_equiv_mm: 30, distortion_k1: 0.02, vignette: 0.2, dof: deep }
framing: { default: medium_close_up, headroom: 0.1, eye_line: 0.4, overscan: 0.1 }
motion: { type: static, amplitude_px: 0, freq_hz: [0.0, 0.0], rotation_deg: 0.0, breathing_sway: false, stabilization: 1.0 }
focus: { autofocus_hunts_per_min: 0.2 }
exposure: { auto_exposure_drift: 0.05 }
color: { lut: luts/webcam_flat.cube, saturation: 0.95 }
compression: { codec: h264, bitrate_kbps: 4000 }
audio: { mic_profile: webcam_mic, distance_m: 0.7 }
