[project]
name = "ce-config"
version = "0.2.0"
description = "Layered config loader, YAML schemas, validation, config digests."
requires-python = ">=3.12"
dependencies = ["ce-core", "pydantic-settings>=2.6", "typer>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_config"]
