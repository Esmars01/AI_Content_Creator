[project]
name = "ce-worker"
version = "0.1.0"
description = "Worker runtime: lease loop, artifact I/O, cancellation, model cache."
requires-python = ">=3.10"
dependencies = ["ce-contracts", "ce-plugin-kit", "httpx>=0.27", "pydantic>=2.7", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_worker"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"  # importable by GPU workers on Python 3.10 (§7)
