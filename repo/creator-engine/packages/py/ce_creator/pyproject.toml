[project]
name = "ce-creator"
version = "0.0.0"
description = "Creator, appearance, voice and wardrobe DNA models; identity pack logic; Creator Test; baselines."
requires-python = ">=3.12"
dependencies = ["ce-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_creator"]
