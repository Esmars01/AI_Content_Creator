[project]
name = "ce-behavior"
version = "0.1.0"
description = "Acting model, CBS resolver, behavior compiler, coverage, observation comparison."
requires-python = ">=3.12"
dependencies = ["ce-build", "ce-config", "ce-contracts", "ce-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_behavior"]
