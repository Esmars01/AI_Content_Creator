[project]
name = "ce-director"
version = "0.1.0"
description = "Director stages, prompt templates, strategy packs, mode templates, intent policy engine."
requires-python = ">=3.12"
dependencies = [
    "ce-behavior",
    "ce-build",
    "ce-config",
    "ce-core",
    "ce-llm",
    "ce-memory",
    "ce-policy",
    "ce-research",
    "ce-router",
    "ce-voice",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_director"]
