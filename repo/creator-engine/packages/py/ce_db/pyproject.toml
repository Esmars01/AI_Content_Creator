[project]
name = "ce-db"
version = "0.2.0"
description = "SQLAlchemy models, Alembic migrations, org-scoped repositories."
requires-python = ">=3.12"
dependencies = ["ce-core", "sqlalchemy[asyncio]>=2.1.3", "alembic>=1.16", "asyncpg>=0.30", "pgvector>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_db"]
