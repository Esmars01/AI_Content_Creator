[project]
name = "ce-router"
version = "0.1.0"
description = "Model router, routing profiles, fallback chains, route pinning."
requires-python = ">=3.12"
dependencies = ["ce-config", "ce-contracts", "ce-core", "ce-policy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_router"]
