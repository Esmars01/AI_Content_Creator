[project]
name = "ce-world"
version = "0.0.0"
description = "World DNA models, world binding and override validation, plates, fingerprints."
requires-python = ">=3.12"
dependencies = ["ce-core", "numpy>=2.0", "pillow>=11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_world"]
