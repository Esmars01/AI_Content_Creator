[project]
name = "ce-realism"
version = "0.7.0"
description = "Realism post: grain, LUT, compression, acoustics."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_realism"]
