[project]
name = "ce-testing"
version = "0.1.0"
description = "Fixtures, mock media generators, factories, invariant helpers."
requires-python = ">=3.12"
dependencies = ["ce-behavior", "ce-build", "ce-config", "ce-contracts", "ce-core", "ce-db", "ce-director", "ce-llm", "ce-memory", "ce-policy", "ce-router", "ce-storage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_testing"]
