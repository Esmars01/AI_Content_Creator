[project]
name = "ce-research"
version = "0.1.0"
description = "Ingestion, chunking, retrieval, claims, SSRF-guarded fetcher."
requires-python = ">=3.12"
dependencies = ["ce-config", "ce-core", "httpx>=0.27", "pypdf>=6.1", "regex"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_research"]
