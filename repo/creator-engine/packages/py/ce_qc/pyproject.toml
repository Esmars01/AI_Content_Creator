[project]
name = "ce-qc"
version = "0.1.0"
description = "QC checks, thresholds, aggregation, performance QA, world QC, consistency, critique."
requires-python = ">=3.12"
dependencies = ["ce-behavior", "ce-config", "ce-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_qc"]
