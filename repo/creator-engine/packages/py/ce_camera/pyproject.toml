[project]
name = "ce-camera"
version = "0.7.0"
description = "Camera profiles, procedural motion, reframing."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_camera"]
