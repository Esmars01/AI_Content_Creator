[project]
name = "ce-memory"
version = "0.1.0"
description = "Creator Memory store, retrieval, snapshots, usage log, repetition guard, contradiction checker."
requires-python = ">=3.12"
dependencies = ["ce-config", "ce-core", "ce-db", "sqlalchemy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_memory"]
