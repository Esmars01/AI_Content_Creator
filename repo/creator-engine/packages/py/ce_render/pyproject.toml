[project]
name = "ce-render"
version = "0.1.0"
description = "Timeline/EDL, FFmpeg filtergraph compiler, captions, mixing."
requires-python = ">=3.12"
dependencies = ["ce-camera", "ce-core", "ce-realism", "numpy>=2.0", "scipy>=1.13", "fonttools>=4.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_render"]
