[project]
name = "ce-storage"
version = "0.1.0"
description = "StorageProvider interface, registry and contract suite; providers are plugins (ADR 0030)."
requires-python = ">=3.12"
dependencies = [
    "ce-contracts",
    "ce-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_storage"]
