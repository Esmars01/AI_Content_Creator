[project]
name = "ce-core"
version = "0.0.0"
description = "Domain models: VideoSpec, SpecPath, anchors, tokenizer, IDs, enums, errors, spec utils, vocab loader."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "regex>=2024.9.11", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_core"]
