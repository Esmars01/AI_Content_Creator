[project]
name = "ce-plugin-kit"
version = "0.1.0"
description = "Building blocks for real model adapters: the engine-adapter base with swappable backends, media helpers, translator helpers, GPU helpers."
# Imported by GPU workers next to upstream model code that may pin Python 3.10 (§7).
requires-python = ">=3.10"
dependencies = ["ce-contracts", "numpy>=1.24", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_plugin_kit"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"
