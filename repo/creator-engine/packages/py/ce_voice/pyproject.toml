[project]
name = "ce-voice"
version = "0.1.0"
description = "Acting-tag parser, exact-script extraction, prosody plan, normalizers, verification loop, lexicon."
requires-python = ">=3.12"
dependencies = ["ce-core", "regex>=2024.9.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_voice"]
