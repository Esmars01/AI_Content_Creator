[project]
name = "ce-contracts"
version = "0.1.0"
description = "Capability interfaces, request/response models, plugin manifest, behavior-matrix schema and the plugin loader."
# GPU workers import this package; some upstream model repos pin Python 3.10 (§7).
requires-python = ">=3.10"
dependencies = ["pydantic>=2.9", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_contracts"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py310"  # importable by GPU workers on Python 3.10 (§7)
