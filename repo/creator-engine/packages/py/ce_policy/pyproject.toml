[project]
name = "ce-policy"
version = "0.1.0"
description = "License policy, consent, blocklists, testimonial guard, provenance rules."
requires-python = ">=3.12"
dependencies = ["ce-config", "ce-contracts", "ce-core", "ce-llm", "pydantic>=2", "regex"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_policy"]
