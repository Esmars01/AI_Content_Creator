[project]
name = "ce-gpu"
version = "0.1.0"
description = "GPUProvider interface and registry (implementations are plugins)."
requires-python = ">=3.12"
dependencies = ["ce-contracts", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_gpu"]
