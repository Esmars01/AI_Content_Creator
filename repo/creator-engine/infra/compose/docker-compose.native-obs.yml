# Override for the observability profile when the application runs natively on the host
# (scripts/dev_native.py): Prometheus scrapes host.docker.internal instead of compose services.
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.native-obs.yml \
#     --profile observability up -d     (= `make obs-native`)
services:
  prometheus:
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ../observability/prometheus.native.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
