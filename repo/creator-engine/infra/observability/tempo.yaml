# Tempo, single binary with local storage (Phase 14).
stream_over_http_enabled: true
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http: {endpoint: 0.0.0.0:4318}
        grpc: {endpoint: 0.0.0.0:4317}
storage:
  trace:
    backend: local
    wal: {path: /var/tempo/wal}
    local: {path: /var/tempo/blocks}
backend_worker:                   # Tempo 3: compaction and retention run in the backend worker
  compaction: {block_retention: 336h}
usage_report:
  reporting_enabled: false
