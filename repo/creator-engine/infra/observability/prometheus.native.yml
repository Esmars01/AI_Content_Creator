# Prometheus for the native mode (scripts/dev_native.py, `make obs-native`): the services run on
# the host, Prometheus in a container reaching them through host.docker.internal. Ports match
# scripts/dev_native.py; the alert rules are the same file as the compose profile's.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["host.docker.internal:9101"]}]
  - job_name: scheduler
    static_configs: [{targets: ["host.docker.internal:9105"]}]
  - job_name: orchestrator
    static_configs: [{targets: ["host.docker.internal:9102"]}]
  - job_name: render-worker
    static_configs: [{targets: ["host.docker.internal:9103"]}]
  - job_name: worker
    static_configs: [{targets: ["host.docker.internal:9104"]}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
